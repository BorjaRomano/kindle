<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Panel e-ink</title>
<!-- Plantilla del panel para Kindle Paperwhite 10 (1072x1448). Los campos con dólar los rellena generate.py -->
<style>
  :root { --ink: #000; --mid: #555; --light: #bbb; --paper: #fff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1072px; height: 1448px; background: var(--paper); color: var(--ink); overflow: hidden; }
  body { font-family: Georgia, "DejaVu Serif", "Times New Roman", serif; padding: 48px 64px 40px; display: flex; flex-direction: column; gap: 30px; }
  .sans { font-family: "Noto Sans", "Segoe UI", "DejaVu Sans", Helvetica, Arial, sans-serif; }

  header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 4px solid var(--ink); padding-bottom: 24px; }
  .hora { font-size: 190px; line-height: .85; font-weight: 700; letter-spacing: -6px; }
  .fecha { text-align: right; }
  .fecha .dia { font-size: 56px; font-weight: 700; }
  .fecha .resto { font-size: 38px; color: var(--mid); margin-top: 6px; }

  .tiempo { display: grid; grid-template-columns: 300px 1fr; gap: 32px; align-items: center; }
  .actual { display: flex; align-items: center; gap: 20px; }
  .actual svg { width: 130px; height: 130px; }
  .actual .grados { font-size: 110px; font-weight: 700; line-height: 1; }
  .detalle { font-size: 30px; color: var(--mid); line-height: 1.5; }
  .detalle b { color: var(--ink); }
  .prevision { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 20px; grid-column: 1 / -1; }
  .prevision div { border: 3px solid var(--ink); border-radius: 14px; padding: 14px 0; text-align: center; font-size: 28px; }
  .prevision .d { font-weight: 700; }
  .prevision svg { width: 56px; height: 56px; margin: 6px auto; display: block; }
  .prevision .t { color: var(--mid); }

  h2 { font-size: 30px; text-transform: uppercase; letter-spacing: 4px; color: var(--mid); margin-bottom: 18px; }
  .cols { display: grid; grid-template-columns: 1.2fr 1fr; gap: 48px; flex: 1; }
  .evento { display: grid; grid-template-columns: 120px 1fr; padding: 12px 0; border-bottom: 2px solid var(--light); font-size: 34px; }
  .evento .h { font-weight: 700; }
  .evento .l { display: block; font-size: 26px; color: var(--mid); margin-top: 4px; }
  .evento.ahora { background: var(--ink); color: var(--paper); border-radius: 12px; padding: 16px 14px; border: 0; margin: 4px -14px; }
  .evento.ahora .l { color: var(--light); }
  .evento.pasado { color: var(--mid); }
  .tarea { display: flex; gap: 18px; align-items: center; font-size: 34px; padding: 14px 0; }
  .caja { width: 40px; height: 40px; border: 4px solid var(--ink); border-radius: 8px; flex: none; }
  .hecha { color: var(--mid); text-decoration: line-through; }
  .hecha .caja { background: var(--ink); }

  blockquote { border-left: 8px solid var(--ink); padding: 8px 0 8px 32px; font-size: 34px; font-style: italic; line-height: 1.3; }
  blockquote cite { display: block; font-size: 28px; font-style: normal; color: var(--mid); margin-top: 10px; }

  footer { display: flex; justify-content: space-between; font-size: 24px; color: var(--mid); border-top: 2px solid var(--light); padding-top: 14px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="sol" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round">
      <circle cx="50" cy="50" r="18" fill="#000"/>
      <path d="M50 10v12M50 78v12M10 50h12M78 50h12M22 22l8 8M70 70l8 8M22 78l8-8M70 30l8-8"/>
    </g>
    <g id="nube" fill="#fff" stroke="#000" stroke-width="6" stroke-linejoin="round">
      <path d="M28 76h46a16 16 0 0 0 0-32 22 22 0 0 0-42-4 18 18 0 0 0-4 36z"/>
    </g>
    <g id="lluvia">
      <use href="#nube" transform="translate(0,-10)"/>
      <path d="M36 80l-6 12M54 80l-6 12M72 80l-6 12" stroke="#000" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g id="nieve">
      <use href="#nube" transform="translate(0,-10)"/>
      <g fill="#000"><circle cx="34" cy="86" r="5"/><circle cx="52" cy="92" r="5"/><circle cx="70" cy="86" r="5"/></g>
    </g>
    <g id="tormenta">
      <use href="#nube" transform="translate(0,-10)"/>
      <path d="M54 70l-12 16h12l-8 14" fill="none" stroke="#000" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <g id="niebla" stroke="#000" stroke-width="6" stroke-linecap="round">
      <path d="M18 38h64M10 54h80M18 70h64"/>
    </g>
    <g id="solnube">
      <g transform="translate(18,-6) scale(.75)"><use href="#sol"/></g>
      <use href="#nube" transform="translate(-4,8)"/>
    </g>
  </defs>
</svg>

<header>
  <div class="hora sans" style="visibility: $hora_visible">$hora</div>
  <div class="fecha sans">
    <div class="dia">$dia</div>
    <div class="resto">$fecha</div>
  </div>
</header>

<section class="tiempo sans">
  <div class="actual">
    <svg viewBox="0 0 100 100"><use href="#$icono"/></svg>
    <div class="grados">$temp°</div>
  </div>
  <div class="detalle">
    <b>$ciudad · $descripcion</b><br>
    Máx $max° · Mín $min° · Lluvia $lluvia%<br>
    Viento $viento km/h · Humedad $humedad%
  </div>
  <div class="prevision">$prevision</div>
</section>

<section class="cols sans">
  <div>
    <h2>Hoy</h2>
    $eventos
  </div>
  <div>
    <h2>Tareas</h2>
    $tareas
  </div>
</section>

<blockquote>“$frase”
  <cite class="sans">— $autor</cite>
</blockquote>

<footer class="sans"><span>Actualizado $hora · $ciudad</span><span>$aviso</span></footer>
</body>
</html>
